[package]
name = "net_bindings"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "net_bindings"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
net = { path = "../libnet" }
base64 = { workspace = true }
getrandom = { workspace = true }
log = { workspace = true }
mio = { workspace = true }
quiche = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }
url = { workspace = true }
simple-dns = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
