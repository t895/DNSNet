[workspace]
resolver = "3"
members = ["libnetAndroid"]

[profile.release]
lto = "fat"

[workspace.dependencies]
base64 = "0.22.1"
bincode = "2.0.1"
etherparse = "0.19.0"
getrandom = "0.3.4"
libc = "0.2.177"
log = "0.4.28"
lru = "0.16.2"
mio = { version="1.1.0", features=["net","os-poll","os-ext"] }
quiche = "0.24.6"
simple-dns = "0.11.0"
thiserror = "2.0.17"
uniffi = { version = "0.30.0", features = ["cli"] }
url = "2.5.7"
