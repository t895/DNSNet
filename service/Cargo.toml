[workspace]
resolver = "3"
members = ["libnet_bindings", "libnet"]

[profile.release]
lto = "thin"

[workspace.dependencies]
ahash = "0.8.12"
android_logger = "0.15.1"
base64 = "0.22.1"
bincode = "2.0.1"
criterion = { version = "0.7.0", features = ["html_reports"] }
etherparse = "0.19.0"
getrandom = "0.3.4"
log = "0.4.29"
lru = "0.16.3"
mio = { version="1.1.1", features=["net","os-poll","os-ext"] }
quiche = "0.24.8"
simple-dns = "0.11.2"
simple_logger = "5.1.0"
thiserror = "2.0.18"
uniffi = { version = "0.31.0", features = ["cli"] }
url = "2.5.8"
